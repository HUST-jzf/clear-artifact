[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clear-assurance"
version = "2.0.0"
description = "Scoped lifecycle evidence, qualification and guarded recovery for single-agent tool calls"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
clear-assure = "clear_assurance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
